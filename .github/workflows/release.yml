name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: App/package-lock.json

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package.json version $version" }

      - run: npm ci

      - run: npm test

      - name: Build the installer
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DHTerminal ${{ github.ref_name }}
          generate_release_notes: true
          files: App/release/DHTerminal-Setup-*.exe
          body: |
            **Install or update:** download `DHTerminal-Setup-${{ github.ref_name }}.exe` below and double-click it.
            If DHTerminal is already installed, it is closed and updated in place. Your settings and profiles are kept.

      - name: Keep the files (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: DHTerminal-windows
          path: App/release/DHTerminal-Setup-*.exe
